name: Build GlockPlugin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Preparar los archivos del plugin subido
        run: |
          mkdir -p source-upload src/main/java/com/example/glock src/main/resources
          unzip -o Glocksfiles.zip -d source-upload
          cp source-upload/GlockPlugin.java src/main/java/com/example/glock/GlockPlugin.java
          cp source-upload/plugin.yml src/main/resources/plugin.yml
      - name: Compilar plugin
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: GlockPlugin-1.0.0
          path: target/GlockPlugin-1.0.0.jar
          if-no-files-found: error
