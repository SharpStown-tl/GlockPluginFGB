name: Build GlockPlugin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: GlockPlugin-1.0.0
          path: target/GlockPlugin-1.0.0.jar
          if-no-files-found: error
